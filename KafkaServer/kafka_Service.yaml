version: "1.0"
services:
  eureka-server:
    image: eureka-server
    container_name: eureka-server
    ports:
      - 8761:8761
    networks:
      - eureka_network
  kafka:
    image: bitnami/kafka
    container_name: kafka
    ports:
    - 9092:9092
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_KRAFT_CLUSTER_ID=my-cluster
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    networks:
      - kafka_network
  consumer_service:
    build: .
    image: consumer_service
    container_name: consumer_container
    ports:
      - 8088:8080
    networks:
      - eureka_network
      - kafka_network
    environment:
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
    depends_on:
      - eureka-server
      - kafka
    restart: unless-stopped
networks:
  eureka_network:
    name: eureka_network
  kafka_network:
    name: kafka_network


